<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">ECS 1436 — C++</title>
  <desc id="desc">Lecture notes, assignments, and labs. A terminal command compiles a C++ exercise with a softly blinking cursor.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1">
      <stop stop-color="#151a23"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <clipPath id="typing"><rect class="reveal" x="70" y="173" width="790" height="30"/></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .reveal { animation: type 10s steps(44, end) infinite; }
    .caret { animation: travel 10s steps(44, end) infinite, blink 1s step-end infinite; }
    @keyframes type {
      0%, 8% { width: 0; }
      52%, 92% { width: 478px; }
      100% { width: 0; }
    }
    @keyframes travel {
      0%, 8% { transform: translateX(0); }
      52%, 92% { transform: translateX(478px); }
      100% { transform: translateX(0); }
    }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .reveal { animation: none; width: 790px; }
      .caret { animation: none; opacity: 0; }
    }
  </style>
  <rect width="960" height="280" rx="20" fill="url(#surface)"/>
  <text class="mono" x="40" y="38" fill="#8d98a9" font-size="12" letter-spacing="1.2">xKatzfiell / cpp</text>
  <text class="sans" x="38" y="100" fill="#f4f6fa" font-size="49" font-weight="600" letter-spacing="-1.8">ECS 1436</text>
  <text class="sans" x="40" y="132" fill="#a5afbf" font-size="17">Lecture notes. Assignments. Lab exercises.</text>
  <text class="mono" x="843" y="94" fill="#7cb7ff" font-size="34" font-weight="500">C++</text>
  <path d="M40 154H920" stroke="#ffffff12"/>
  <text class="mono" x="40" y="195" fill="#82d6b5" font-size="18">$</text>
  <g clip-path="url(#typing)">
    <text class="mono" x="70" y="195" fill="#dce4f0" font-size="18" textLength="475" lengthAdjust="spacingAndGlyphs">g++ -std=c++17 assignments/lab1.cpp -o lab1</text>
  </g>
  <rect class="caret" x="72" y="178" width="8" height="21" rx="1" fill="#82d6b5"/>
  <text class="mono" x="40" y="242" fill="#7f8b9e" font-size="13">cpp_lectures/</text>
  <text class="mono" x="197" y="242" fill="#7f8b9e" font-size="13">assignments/</text>
</svg>
